    <style>
        /* Professional Custom Loading Screen */
        body { background-color: #050A14; margin: 0; }
        .studio-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #E0E1DD;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #050A14;
        }
        .neon-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 180, 216, 0.1);
            border-top: 4px solid #00B4D8;
            border-radius: 50%;
            animation: spin 1s linear infinite, glow 2s ease-in-out infinite alternate;
            margin-bottom: 25px;
        }
        .studio-loader h2 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            font-weight: 300;
            color: #00B4D8;
            margin: 0;
            animation: pulse 2s infinite alternate;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(0, 180, 216, 0.2); }
            to { box-shadow: 0 0 20px rgba(0, 180, 216, 0.8), 0 0 40px rgba(0, 180, 216, 0.4); }
        }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
    </style>
